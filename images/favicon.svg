<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="100%" height="100%">
  <defs>
    <linearGradient id="chronBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2026"/>
      <stop offset="100%" stop-color="#0b0c0f"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2ff00"/>
      <stop offset="100%" stop-color="#9dff00"/>
    </linearGradient>
    <filter id="dialGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Chronometer Circle Bezel -->
  <circle cx="20" cy="20" r="17.5" fill="url(#chronBg)" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.5"/>

  <!-- Inner Chronometer Track Ring -->
  <circle cx="20" cy="20" r="14.5" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- 12-Hour Chrono Tick Marks -->
  <line x1="20" y1="5.5" x2="20" y2="8.5" stroke="#d2ff00" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="34.5" y1="20" x2="31.5" y2="20" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="20" y1="34.5" x2="20" y2="31.5" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="5.5" y1="20" x2="8.5" y2="20" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Radial Hour Markers -->
  <circle cx="27" cy="8" r="0.9" fill="rgba(255,255,255,0.3)"/>
  <circle cx="32" cy="13" r="0.9" fill="rgba(255,255,255,0.3)"/>
  <circle cx="32" cy="27" r="0.9" fill="rgba(255,255,255,0.3)"/>
  <circle cx="27" cy="32" r="0.9" fill="rgba(255,255,255,0.3)"/>
  <circle cx="13" cy="32" r="0.9" fill="rgba(255,255,255,0.3)"/>
  <circle cx="8" cy="27" r="0.9" fill="rgba(255,255,255,0.3)"/>
  <circle cx="8" cy="13" r="0.9" fill="rgba(255,255,255,0.3)"/>
  <circle cx="13" cy="8" r="0.9" fill="rgba(255,255,255,0.3)"/>

  <!-- Hour Hand -->
  <line x1="20" y1="20" x2="13" y2="13" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Minute & Pulse Hand -->
  <path d="M 20 20 L 24.5 15.5 L 26.5 18 L 30.5 10.5" fill="none" stroke="url(#limeGrad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#dialGlow)"/>

  <!-- Center Pivot Crown -->
  <circle cx="20" cy="20" r="2.2" fill="#ff3b30"/>
  <circle cx="20" cy="20" r="0.8" fill="#ffffff"/>
</svg>
